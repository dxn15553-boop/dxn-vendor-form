name: Build and Deploy to Hostinger FTP

on:
  push:
    branches:
      - main # Change this if your main branch is named 'master'
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 🟢 Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: 📦 Install dependencies
      run: npm ci
      
    - name: 🏗️ Build Project
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      run: npm run build
      
    - name: 📦 Install lftp
      run: sudo apt-get install -y lftp
      
    - name: 📂 Deploy to Hostinger
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        lftp -c "
        set ssl:verify-certificate no;
        set net:timeout 60;
        set ftp:passive-mode yes;
        open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
        mirror -R --verbose ./dist/assets/ /domains/dxnmanufacturing.com/public_html/assets/;
        put -O /domains/dxnmanufacturing.com/public_html/ ./dist/index.html;
        "

